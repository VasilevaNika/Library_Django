version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  app:
    image: git.klsh.ru/team4/library:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://library:library@postgres:5432/library
      DJANGO_ALLOWED_HOSTS: team4.klsh.ru,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
