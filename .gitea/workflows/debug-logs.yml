name: Debug Logs - Get Errors

on:
  workflow_dispatch:

jobs:
  debug:
    name: Get all logs and connection info
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.RUNNER_TOKEN }}" | docker login git.klsh.ru \
            -u team4 --password-stdin

      - name: Pull latest images
        run: |
          docker pull git.klsh.ru/team4/library:latest
          docker pull git.klsh.ru/team4/recommendations:latest
          docker pull git.klsh.ru/team4/reviews:latest
          docker pull git.klsh.ru/team4/notifications:latest

      - name: Start services
        run: |
          docker compose -f docker-compose.prod.yml up -d
          sleep 10

      - name: Show container status
        run: |
          echo "=== CONTAINER STATUS ==="
          docker compose -f docker-compose.prod.yml ps

      - name: Show all logs
        run: |
          echo "=== MONOLITH LOGS ==="
          docker compose -f docker-compose.prod.yml logs monolith --tail=100
          echo ""
          echo "=== REVIEWS LOGS ==="
          docker compose -f docker-compose.prod.yml logs reviews --tail=100
          echo ""
          echo "=== RECOMMENDATIONS LOGS ==="
          docker compose -f docker-compose.prod.yml logs recommendations --tail=100
          echo ""
          echo "=== NOTIFICATIONS LOGS ==="
          docker compose -f docker-compose.prod.yml logs notifications --tail=100

      - name: Check env variables in Monolith
        run: |
          echo "=== MONOLITH ENV VARIABLES ==="
          docker compose -f docker-compose.prod.yml exec -T monolith python -c "import os; print('REVIEWS_SERVICE_URL:', os.getenv('REVIEWS_SERVICE_URL')); print('RECOMMENDATIONS_SERVICE_URL:', os.getenv('RECOMMENDATIONS_SERVICE_URL')); print('NOTIFICATIONS_SERVICE_URL:', os.getenv('NOTIFICATIONS_SERVICE_URL'))"

      - name: Test connection from Monolith to Reviews
        run: |
          echo "=== TESTING CONNECTION FROM MONOLITH TO REVIEWS ==="
          docker compose -f docker-compose.prod.yml exec -T monolith python -c "import urllib.request; import urllib.error; import sys; sys.exit(0)"

      - name: Check Reviews service health
        run: |
          echo "=== CHECKING REVIEWS SERVICE ==="
          docker compose -f docker-compose.prod.yml exec -T reviews python -c "import urllib.request; print('Reviews service is running')"

      - name: Final status
        run: |
          echo "=== COLLECTION COMPLETE ==="
          echo "Logs have been collected. Check the output above."