name: Deploy Check

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.RUNNER_TOKEN }}" | docker login git.klsh.ru \
            -u team4 --password-stdin

      - name: Pull latest image
        run: docker pull git.klsh.ru/team4/library:latest

      - name: Stop existing containers (if any)
        run: |
          docker compose -f docker-compose.prod.yml down --remove-orphans || true
          docker ps -q --filter "publish=8004" | xargs -r docker rm -f || true

      - name: Start services
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for Django to start
        run: |
          echo "Waiting for Django..."
          for i in $(seq 1 24); do
            if docker compose -f docker-compose.prod.yml exec -T app \
                python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)" \
                > /dev/null 2>&1; then
              echo "Django responded on attempt $i"
              exit 0
            fi
            echo "Attempt $i/24 — not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Django did not respond after 2 minutes!"
          docker compose -f docker-compose.prod.yml logs
          exit 1

      - name: Django responded successfully
        run: echo "Django responded successfully!"
