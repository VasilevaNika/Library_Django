name: Deploy Check

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.RUNNER_TOKEN }}" | docker login git.klsh.ru \
            -u team4 --password-stdin

      - name: Pull latest images
        run: |
          docker pull git.klsh.ru/team4/library:latest
          docker pull git.klsh.ru/team4/recommendations:latest
          docker pull git.klsh.ru/team4/reviews:latest
          docker pull git.klsh.ru/team4/notifications:latest

      - name: Stop existing containers (if any)
        run: |
          docker compose -f docker-compose.prod.yml down --remove-orphans || true

      - name: Start services
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for all services to start
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml ps --format json | grep -q '"Status":".*Up.*"; then
              echo "Services are up on attempt $i"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done
          
          echo "=== Container status ==="
          docker compose -f docker-compose.prod.yml ps
          
          echo "=== Monolith logs ==="
          docker compose -f docker-compose.prod.yml logs monolith --tail=20

      - name: Verify Django health
        run: |
          if docker compose -f docker-compose.prod.yml exec -T monolith \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)" \
              > /dev/null 2>&1; then
            echo "✅ Django responded successfully!"
          else
            echo "❌ Django did not respond!"
            docker compose -f docker-compose.prod.yml logs monolith
            exit 1
          fi

      - name: Verify all services running
        run: |
          SERVICES="recommendations reviews notifications"
          for service in $SERVICES; do
            if docker compose -f docker-compose.prod.yml ps --format json | grep -q "\"Service\":\"$service\".*\"Status\":\".*Up.*\""; then
              echo "✅ $service is running"
            else
              echo "❌ $service is not running!"
              docker compose -f docker-compose.prod.yml logs $service --tail=30
              exit 1
            fi
          done
          
          echo "🎉 All services deployed successfully!"