name: Deploy Check

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.RUNNER_TOKEN }}" | docker login git.klsh.ru \
            -u team4 --password-stdin

      - name: Pull latest images
        run: |
          docker pull git.klsh.ru/team4/library:latest
          docker pull git.klsh.ru/team4/recommendations:latest
          docker pull git.klsh.ru/team4/reviews:latest
          docker pull git.klsh.ru/team4/notifications:latest

      - name: Stop existing containers
        run: |
          docker compose -f docker-compose.prod.yml down --remove-orphans || true

      - name: Start services
        run: |
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for services to initialize
        run: |
          echo "Waiting 30 seconds for services to start..."
          sleep 30

      - name: Show container status
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.prod.yml ps

      - name: Show all service logs
        run: |
          echo "=== All Services Logs (last 30 lines) ==="
          docker compose -f docker-compose.prod.yml logs --tail=30

      - name: Check Monolith (Django)
        run: |
          echo "Checking Monolith on port 8004..."
          if curl -f -s -o /dev/null http://localhost:8004/; then
            echo "✅ Monolith is responding on port 8004"
          else
            echo "❌ Monolith is not responding on port 8004"
            docker compose -f docker-compose.prod.yml logs monolith --tail=50
            exit 1
          fi

      - name: Check Recommendations Service
        run: |
          echo "Checking Recommendations Service on port 8001..."
          if curl -f -s -o /dev/null http://localhost:8001/; then
            echo "✅ Recommendations Service is responding on port 8001"
          else
            echo "❌ Recommendations Service is not responding on port 8001"
            docker compose -f docker-compose.prod.yml logs recommendations --tail=50
            exit 1
          fi

      - name: Check Reviews Service
        run: |
          echo "Checking Reviews Service on port 8002..."
          if curl -f -s -o /dev/null http://localhost:8002/; then
            echo "✅ Reviews Service is responding on port 8002"
          else
            echo "❌ Reviews Service is not responding on port 8002"
            docker compose -f docker-compose.prod.yml logs reviews --tail=50
            exit 1
          fi

      - name: Check Notifications Service
        run: |
          echo "Checking Notifications Service on port 8003..."
          if curl -f -s -o /dev/null http://localhost:8003/; then
            echo "✅ Notifications Service is responding on port 8003"
          else
            echo "❌ Notifications Service is not responding on port 8003"
            docker compose -f docker-compose.prod.yml logs notifications --tail=50
            exit 1
          fi

      - name: All services deployed successfully
        run: |
          echo "🎉🎉🎉 ALL SERVICES DEPLOYED SUCCESSFULLY! 🎉🎉🎉"
          echo ""
          echo "Services running:"
          echo "  - Monolith (Django): http://localhost:8004"
          echo "  - Recommendations: http://localhost:8001"
          echo "  - Reviews: http://localhost:8002"
          echo "  - Notifications: http://localhost:8003"
          echo ""
          echo "PostgreSQL is running on port 5434 (internal) or 5432 (container)"