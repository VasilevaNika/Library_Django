name: Deploy Check

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.RUNNER_TOKEN }}" | docker login git.klsh.ru \
            -u team4 --password-stdin

      - name: Pull latest images
        run: |
          docker pull git.klsh.ru/team4/library:latest
          docker pull git.klsh.ru/team4/recommendations:latest
          docker pull git.klsh.ru/team4/reviews:latest
          docker pull git.klsh.ru/team4/notifications:latest

      - name: Stop existing containers
        run: |
          docker compose -f docker-compose.prod.yml down --remove-orphans || true

      - name: Start services
        run: |
          docker compose -f docker-compose.prod.yml up -d

      - name: Wait for services to initialize
        run: |
          echo "Waiting 30 seconds for services to start..."
          sleep 30

      - name: Show container status
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.prod.yml ps

      - name: Show all service logs
        run: |
          echo "=== All Services Logs (last 30 lines) ==="
          docker compose -f docker-compose.prod.yml logs --tail=30

      - name: Check Monolith (Django) via docker exec
        run: |
          echo "Checking Monolith via internal Docker network..."
          if docker compose -f docker-compose.prod.yml exec -T monolith curl -f -s -o /dev/null http://localhost:8000/; then
            echo "✅ Monolith is responding internally on port 8000"
          else
            echo "❌ Monolith is not responding internally"
            docker compose -f docker-compose.prod.yml logs monolith --tail=50
            exit 1
          fi

      - name: Check Recommendations Service via docker exec
        run: |
          echo "Checking Recommendations Service..."
          if docker compose -f docker-compose.prod.yml exec -T recommendations curl -f -s -o /dev/null http://localhost:8000/; then
            echo "✅ Recommendations Service is responding internally"
          else
            echo "❌ Recommendations Service is not responding"
            docker compose -f docker-compose.prod.yml logs recommendations --tail=50
            exit 1
          fi

      - name: Check Reviews Service via docker exec
        run: |
          echo "Checking Reviews Service..."
          if docker compose -f docker-compose.prod.yml exec -T reviews curl -f -s -o /dev/null http://localhost:8000/; then
            echo "✅ Reviews Service is responding internally"
          else
            echo "❌ Reviews Service is not responding"
            docker compose -f docker-compose.prod.yml logs reviews --tail=50
            exit 1
          fi

      - name: Check Notifications Service via docker exec
        run: |
          echo "Checking Notifications Service..."
          if docker compose -f docker-compose.prod.yml exec -T notifications curl -f -s -o /dev/null http://localhost:8000/; then
            echo "✅ Notifications Service is responding internally"
          else
            echo "❌ Notifications Service is not responding"
            docker compose -f docker-compose.prod.yml logs notifications --tail=50
            exit 1
          fi

      - name: Check external port 8004 (optional)
        run: |
          echo "Checking external access on port 8004..."
          if curl -f -s -o /dev/null http://localhost:8004/; then
            echo "✅ External access on port 8004 works"
          else
            echo "⚠️ External access on port 8004 does not work (but internal is fine)"
            echo "This might be normal in GitHub Actions environment"
          fi

      - name: All services deployed successfully
        run: |
          echo "🎉🎉🎉 ALL SERVICES DEPLOYED SUCCESSFULLY! 🎉🎉🎉"
          echo ""
          echo "Services are running and responding internally:"
          echo "  - Monolith (Django): internal port 8000, external port 8004"
          echo "  - Recommendations: internal port 8000, external port 8001"
          echo "  - Reviews: internal port 8000, external port 8002"
          echo "  - Notifications: internal port 8000, external port 8003"