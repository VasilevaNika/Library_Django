# Одна главная БД PostgreSQL `library` — сначала миграции монолита Django, затем Alembic у микросервисов.
# Порядок: postgres → monolith (healthy) → recommendations → reviews → notifications.
#
# Запуск из каталога Library_Django:
#   docker compose -f docker-compose.microservices.yml up --build
#
# Порты: 8000 монолит Django, 8001 recommendations, 8002 reviews, 8003 notifications, 5434 — Postgres.
# После смены с одной/двух БД на общую: docker compose down -v

# Одна строка подключения для монолита и всех микросервисов (та же БД `library`).
x-database-environment: &database-environment
  DATABASE_URL: postgresql://library:library@postgres:5432/library

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5434:5432"
    volumes:
      - pg_shared:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Монолит Django — владелец схемы ORM (auth, library_*). Та же БД, что у FastAPI (DB_* ниже).
  # После изменений каталога: exec monolith python manage.py sync_microservice_mirror [--prune убирает сиды Alembic]
  monolith:
    build:
      context: .
      dockerfile: Dockerfile
      # Как у микросервисов: при проблемах DNS внутри build (pip → PyPI) использует резолвер хоста.
      network: host
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      <<: *database-environment
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,monolith
      RECOMMENDATIONS_SERVICE_URL: http://recommendations-service:8000
      REVIEWS_SERVICE_URL: http://reviews-service:8000
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  recommendations-service:
    build:
      context: ./recomendations-service
      network: host
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8001:8000"
    volumes:
      - ./recomendations-service:/app
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
      monolith:
        condition: service_healthy
    networks:
      - backend

  reviews-service:
    build:
      context: ./reviews-services
      network: host
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8002:8000"
    volumes:
      - ./reviews-services:/app
    environment:
      <<: *database-environment
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      recommendations-service:
        condition: service_started
    networks:
      - backend

  notifications-service:
    build:
      context: ./notifications-service
      network: host
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8003:8000"
    volumes:
      - ./notifications-service:/app
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
      reviews-service:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pg_shared:
