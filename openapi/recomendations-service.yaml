# Писарев Даниил, микросервис рекомендаций

openapi: 3.0.0
info:
  title: Микросервис рекомендаций библиотеки
  description: |
    API для получения рекомендаций книг и управления персональными настройками.
  version: 3.0.0

servers:
  - url: http://localhost:8000
    description: Локальный сервер микросервиса рекомендаций

paths:
  # 1. GET - популярные книги
  /recommendations/popular:
    get:
      summary: Популярные книги
      description: Возвращает список самых популярных книг
      parameters:
        - name: limit
          in: query
          required: false
          description: Количество книг
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Список популярных книг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookRecommendation'

  # 2. GET - новинки
  /recommendations/new:
    get:
      summary: Новинки
      description: Недавно добавленные книги
      parameters:
        - name: limit
          in: query
          required: false
          description: Количество книг
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Список новинок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookRecommendation'

  # 3. GET - популярные книги по жанру
  /recommendations/genre/{genreId}:
    get:
      summary: Популярное в жанре
      description: Самые популярные книги в указанном жанре (по рейтингу)
      parameters:
        - name: genreId
          in: path
          required: true
          description: ID жанра
          schema:
            type: integer
            example: 2
        - name: limit
          in: query
          required: false
          description: Количество книг
          schema:
            type: integer
            default: 10
        - name: min_rating
          in: query
          required: false
          description: Минимальный рейтинг
          schema:
            type: number
            minimum: 0
            maximum: 5
            default: 4
            example: 4.5
      responses:
        '200':
          description: Топ книг жанра
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookRecommendation'
        '404':
          $ref: '#/components/responses/GenreNotFound'

  # 4. GET - популярные книги автора
  /recommendations/author/{authorId}:
    get:
      summary: Популярное у автора
      description: Самые популярные книги указанного автора (по рейтингу)
      parameters:
        - name: authorId
          in: path
          required: true
          description: ID автора
          schema:
            type: integer
            example: 42
        - name: limit
          in: query
          required: false
          description: Количество книг
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Топ книг автора
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookRecommendation'
        '404':
          $ref: '#/components/responses/AuthorNotFound'

  # 5. GET - похожие книги
  /recommendations/similar/{bookId}:
    get:
      summary: Похожие книги
      description: Книги, похожие на указанную
      parameters:
        - name: bookId
          in: path
          required: true
          description: ID книги
          schema:
            type: integer
            example: 15
        - name: limit
          in: query
          required: false
          description: Количество книг
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Похожие книги
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookRecommendation'
        '404':
          $ref: '#/components/responses/BookNotFound'

  # 6. GET - случайная книга
  /recommendations/random:
    get:
      summary: Случайная книга
      description: Одна случайная книга
      parameters:
        - name: genre_id
          in: query
          required: false
          description: Ограничить жанром
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Случайная книга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRecommendation'

  # 7. POST - добавить книгу в игнор-лист
  /user/{userId}/ignore:
    post:
      summary: Игнорировать книгу
      description: Добавляет книгу в список игнорируемых (не будет рекомендоваться пользователю)
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_id:
                  type: integer
                  description: ID книги
                  example: 15
                reason:
                  type: string
                  description: Причина (необязательно)
                  enum: [already_read, not_interesting, dislike_author, other]
                  example: already_read
              required:
                - book_id
      responses:
        '201':
          description: Книга добавлена в игнор-лист
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Книга больше не будет вам рекомендоваться"
                  book_id:
                    type: integer
                    example: 15
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'

  # 8. DELETE - удалить книгу из игнор-листа
    delete:
      summary: Перестать игнорировать
      description: Удаляет книгу из списка игнорируемых
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_id:
                  type: integer
                  description: ID книги
                  example: 15
              required:
                - book_id
      responses:
        '200':
          description: Книга удалена из игнор-листа
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Книга снова может вам рекомендоваться"
        '404':
          $ref: '#/components/responses/IgnoreNotFound'

  # 9. POST - сохранить книгу в "прочитать позже"
  /user/{userId}/reading-list:
    post:
      summary: Добавить в список чтения
      description: Сохраняет книгу в персональный список "прочитать позже"
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_id:
                  type: integer
                  description: ID книги
                  example: 15
                priority:
                  type: string
                  description: Приоритет
                  enum: [high, medium, low]
                  default: medium
                  example: high
              required:
                - book_id
      responses:
        '201':
          description: Книга добавлена в список чтения
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Книга сохранена в список 'прочитать позже'"
                  book_id:
                    type: integer
                    example: 15
        '400':
          $ref: '#/components/responses/BadRequest'

  # 10. DELETE - удалить книгу из "прочитать позже"
    delete:
      summary: Удалить из списка чтения
      description: Убирает книгу из списка "прочитать позже"
      parameters:
        - name: userId
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_id:
                  type: integer
                  description: ID книги
                  example: 15
              required:
                - book_id
      responses:
        '200':
          description: Книга удалена из списка
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Книга удалена из списка чтения"
        '404':
          $ref: '#/components/responses/ReadingListNotFound'

components:
  schemas:
    BookRecommendation:
      type: object
      description: Базовая информация о книге
      properties:
        id:
          type: integer
          description: ID книги
          example: 15
        title:
          type: string
          description: Название
          example: "Мастер и Маргарита"
        author:
          type: string
          description: Автор
          example: "Михаил Булгаков"
        author_id:
          type: integer
          description: ID автора
          example: 42
        genre_id:
          type: integer
          description: ID жанра
          example: 1
        genre_name:
          type: string
          description: Название жанра
          example: "Классика"
        year:
          type: integer
          description: Год издания
          example: 1967
        cover:
          type: string
          description: Ссылка на обложку
          example: "/covers/15.jpg"
        rating:
          type: number
          format: float
          description: Средний рейтинг
          example: 4.8
        rating_count:
          type: integer
          description: Количество оценок
          example: 1250
      required:
        - id
        - title
        - author

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Неверные данные в запросе"
    UserNotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Пользователь с указанным ID не существует"
    GenreNotFound:
      description: Жанр не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Жанр с указанным ID не существует"
    AuthorNotFound:
      description: Автор не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Автор с указанным ID не найден"
    BookNotFound:
      description: Книга не найдена
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Книга с указанным ID не существует"
    IgnoreNotFound:
      description: Книга не в игнор-листе
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Эта книга не находится в списке игнорируемых"
    ReadingListNotFound:
      description: Книга не в списке чтения
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Книга не найдена в списке 'прочитать позже'"